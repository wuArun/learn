apiVersion: v1
kind: Namespace
metadata:
  name: agent-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: agent-app
data:
  LOG_LEVEL: "INFO"
  SERVER_PORT: "8080"
  AI_MODEL: "qwen-max"
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: agent-app
type: Opaque
stringData:
  DASHSCOPE_API_KEY: "your-api-key-here"  # 需要替换
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-app
  namespace: agent-app
  labels:
    app: agent-app
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agent-app
  template:
    metadata:
      labels:
        app: agent-app
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: agent-app
      containers:
      - name: agent-app
        image: ghcr.io/wuArun/learn:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        # 环境变量
        env:
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx512m"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: agent-config
              key: LOG_LEVEL
        - name: DASHSCOPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-secrets
              key: DASHSCOPE_API_KEY
        
        # 健康检查
        livenessProbe:
          httpGet:
            path: /api/agent/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/agent/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # 资源限制
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # 安全上下文
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        
        # 卷挂载
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      
      # 卷定义
      volumes:
      - name: logs
        emptyDir: {}
      
      # Pod 安全策略
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      
      # 亲和性规则
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - agent-app
              topologyKey: kubernetes.io/hostname
      
      # 容错设置
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: agent-app
  namespace: agent-app
  labels:
    app: agent-app
spec:
  type: LoadBalancer
  selector:
    app: agent-app
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-app-hpa
  namespace: agent-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-app
  namespace: agent-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-app
  namespace: agent-app
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-app
  namespace: agent-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-app
subjects:
- kind: ServiceAccount
  name: agent-app
  namespace: agent-app
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-app-network-policy
  namespace: agent-app
spec:
  podSelector:
    matchLabels:
      app: agent-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
